---
name: Github-actions workflow for java code
on:
  push:
    braches:
      -master
  pull_request:
    branches:
      -master
  workflow_dispatch:
jobs:
  Build_java_code:
    runs-on: ubuntu-24.04
    steps :
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup jdk
        uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'oracle'
      - name: Setup maven
        uses: actions/setup-maven@v4
          with:
            maven-version: '3.8.4'
      - name:  Package application
        run: mvn clean package
  
     
     
